{% extends "base.html" %}{% block content %}<div class="container app-container page-section form-page"><div class="form-page-heading"><a href="{{ url_for('employee.employeeDetail', id=employee.id) }}" class="back-link"><i class="bi bi-arrow-left"></i> Back to profile</a><p class="eyebrow"><i class="bi bi-pencil-square"></i> Employee profile</p><h1>Edit {{ employee.name }}</h1></div><section class="form-card"><form action="{{ url_for('employee.employeeUpdate', id=employee.id) }}" method="POST" class="needs-validation" novalidate><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><div class="form-grid"><div class="form-field"><label for="name">Full name</label><input type="text" id="name" name="name" value="{{ employee.name }}" class="form-control" required></div><div class="form-field"><label for="email">Email address</label><input type="email" id="email" name="email" value="{{ employee.email }}" class="form-control" required></div><div class="form-field"><label for="department">Department</label><input type="text" id="department" name="department" value="{{ employee.department.name }}" class="form-control" required></div><div class="form-field"><label for="salary">Annual salary</label><input type="number" step="0.01" min="0" id="salary" name="salary" value="{{ employee.salary }}" class="form-control" required></div><div class="form-field form-field-wide"><label for="password">New password <small>(leave blank to keep current)</small></label><input type="password" id="password" name="password" class="form-control"></div></div><div class="form-actions"><a href="{{ url_for('employee.employeeDetail', id=employee.id) }}" class="btn btn-ghost">Cancel</a><button type="submit" class="btn btn-primary"><i class="bi bi-check2"></i> Save changes</button></div></form></section></div>{% endblock %}
